services:
  postgres:
    image: postgres:16-alpine
    container_name: kestrel-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel_dev_password
      POSTGRES_DB: kestrel_it
    volumes:
      - kestrel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kestrel -d kestrel_it']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kestrel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: kestrel_minio
      MINIO_ROOT_PASSWORD: kestrel_minio_secret
    volumes:
      - kestrel_minio_data:/data

volumes:
  kestrel_pg_data:
  kestrel_minio_data:
