x-garage-config: &garage-config
  type: bind
  source: ./garage.toml
  target: /etc/garage.toml
  read_only: true
  bind:
    create_host_path: false

x-s3-credentials: &s3-credentials
  S3_BUCKET: ${S3_BUCKET:-kestrel-it}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK0123456789abcdef01234567}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel_dev_password
      POSTGRES_DB: kestrel_it
    volumes:
      - kestrel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U kestrel -d kestrel_it']
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:3900:3900'
    volumes:
      - *garage-config
      - kestrel_garage_meta:/var/lib/garage/meta
      - kestrel_garage_data:/var/lib/garage/data

  garage-init:
    build:
      context: .
      dockerfile: deploy/images/Dockerfile
      target: garage-init
    depends_on:
      garage:
        condition: service_started
    environment: *s3-credentials
    volumes:
      - *garage-config
      - kestrel_garage_meta:/var/lib/garage/meta:ro

  api:
    build:
      context: .
      dockerfile: deploy/images/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      <<: *s3-credentials
      NODE_ENV: development
      APP_URL: ${APP_URL:-http://localhost:4200}
      API_PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://kestrel:kestrel_dev_password@postgres:5432/kestrel_it
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/ready").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/images/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      KESTREL_API_ORIGIN: http://api:3000
    ports:
      - '127.0.0.1:4200:80'

volumes:
  kestrel_pg_data:
  kestrel_garage_meta:
  kestrel_garage_data:
