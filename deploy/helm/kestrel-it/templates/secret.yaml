{{- if not .Values.config.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel-it.secretName" . }}
  labels:
    {{- include "kestrel-it.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "kestrel-it.databaseUrl" . | quote }}
  JWT_SECRET: {{ .Values.config.secrets.jwtSecret | quote }}
  APP_ENCRYPTION_KEY: {{ .Values.config.secrets.appEncryptionKey | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.config.storage.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.config.storage.s3.secretAccessKey | quote }}
  NEXTCLOUD_USERNAME: {{ .Values.config.storage.nextcloud.username | quote }}
  NEXTCLOUD_APP_PASSWORD: {{ .Values.config.storage.nextcloud.appPassword | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.config.oidc.clientSecret | quote }}
  BETTER_AUTH_SECRET: {{ .Values.config.betterAuth.secret | quote }}
  SMTP_PASSWORD: {{ .Values.config.smtp.password | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.config.bootstrap.adminPassword | quote }}
{{- end -}}
