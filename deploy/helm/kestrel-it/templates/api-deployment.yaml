{{- if and (eq .Values.config.storage.driver "local") (gt (int .Values.api.replicaCount) 1) }}
{{- if not (and .Values.persistence.enabled (eq .Values.persistence.accessMode "ReadWriteMany")) }}
{{- fail "Multiple API replicas with local storage require a ReadWriteMany claim. Set api.replicaCount=1 or use shared storage." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kestrel-it.fullname" . }}-api
  labels:
    {{- include "kestrel-it.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "kestrel-it.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kestrel-it.fullname" . }}-config
            - secretRef:
                name: {{ include "kestrel-it.secretName" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if and (eq .Values.config.storage.driver "local") .Values.persistence.enabled }}
          volumeMounts:
            - name: storage-data
              mountPath: {{ .Values.config.storage.localRoot }}
          {{- end }}
      {{- if and (eq .Values.config.storage.driver "local") .Values.persistence.enabled }}
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: {{ include "kestrel-it.fullname" . }}-storage
      {{- end }}
