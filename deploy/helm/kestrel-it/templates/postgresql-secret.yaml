{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel-it.fullname" . }}-postgresql
  labels:
    {{- include "kestrel-it.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Set postgresql.auth.password for the bundled database" .Values.postgresql.auth.password | quote }}
{{- end }}
